  Mode A/B discussion (not run, per Phase 8 spec.md Decision 4 — this category's claim
  is internal to the harness, not a three-way comparison): V1 has no skill routing at
  all, so "was the debugging skill selected" has no V1 analogue to compare against; a
  baseline agent would presumably also "debug" the function without any named-skill
  concept, since general debugging competence isn't something V2's skill routing adds
  to the model — what it adds is a *documented, inspectable methodology* the harness
  can point to and audit, not a capability the base model lacked.
