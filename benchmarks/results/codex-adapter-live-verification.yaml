  the existing writeFullLog/summarizeOutput compaction (Phase 4/5/7), audited via the standard
  tool_invocation event, and denied correctly for a role that hadn't been activated for this
  plan. No automated `go test` run invokes a real codex exec/review call (kept out of the test
  suite for speed/determinism/no API cost, per DECISION_LOG.md) — this file is that real
